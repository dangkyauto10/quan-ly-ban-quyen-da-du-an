# Only placeholders. Enter actual values in Streamlit Settings > Secrets, never GitHub.
# Enable only after connecting a separate empty PostgreSQL database and Google OAuth.
web_login_enabled = true
qr_signing_key = "REPLACE_WITH_STABLE_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"

[app]
database_url = "postgresql+psycopg://USER:PASSWORD@HOST:5432/DATABASE?sslmode=require"
encryption_key = "REPLACE_WITH_VALID_FERNET_KEY"
fingerprint_key = "REPLACE_WITH_STABLE_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
admin_email = "ADMIN_EMAIL_OF_V"

[auth]
redirect_uri = "https://EXACT_WEB_APP_HOST/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
client_id = "GOOGLE_OAUTH_WEB_CLIENT_ID"
client_secret = "GOOGLE_OAUTH_WEB_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Optional for local/default-credential environments. On Streamlit Community Cloud,
# add the service-account JSON fields here and share the target Sheet with client_email.
[google_service_account]
type = "service_account"
project_id = "REPLACE_WITH_SERVICE_ACCOUNT_PROJECT_ID"
private_key_id = "REPLACE_WITH_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_PRIVATE_KEY_FROM_JSON\n-----END PRIVATE KEY-----\n"
client_email = "REPLACE_WITH_SERVICE_ACCOUNT_EMAIL"
client_id = "REPLACE_WITH_SERVICE_ACCOUNT_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "REPLACE_WITH_CLIENT_CERT_URL_FROM_JSON"
universe_domain = "googleapis.com"
